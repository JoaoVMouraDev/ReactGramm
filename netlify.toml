[build]
  command = "pnpm config set only-allow-build-scripts false && pnpm install --no-frozen-lockfile && pnpm run build"
  publish = "dist/public"

# Redirecionamento para garantir que o React Router funcione corretamente
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  NPM_FLAGS = "--legacy-peer-deps"
  PNPM_FLAGS = "--no-frozen-lockfile"
