[build]
  command = "pnpm config set only-allow-build-scripts false && pnpm install --no-frozen-lockfile && pnpm run build"
  publish = "dist/public"

[[redirects]]
  from = "/api/*"
  to = "https://sua-api-no-render-ou-railway.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  NPM_FLAGS = "--legacy-peer-deps"
  PNPM_FLAGS = "--no-frozen-lockfile"
